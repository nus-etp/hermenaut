name: evals

# Static + script suites run on every PR that touches the pipeline, nightly
# (the daily sync commits briefs straight to main, so this is what catches
# brief drift), and on manual dispatch.

on:
  pull_request:
    paths:
      - 'data/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'signals/briefs/**'
      - 'tests/**'
      - 'evals/**'
      - 'pyproject.toml'
      - '.github/workflows/evals.yml'
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run: all | static | scripts'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Deterministic suites: static schema + script unit tests. Always run on PR.
  # ---------------------------------------------------------------------------
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python and install dev deps
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run static suite
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'static' || github.event.inputs.suite == 'all' || github.event_name == 'pull_request'
        run: .venv/bin/pytest tests/static -q

      - name: Run scripts suite
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'scripts' || github.event.inputs.suite == 'all' || github.event_name == 'pull_request'
        run: .venv/bin/pytest tests/scripts -q

      - name: Check scenario cards
        run: python3 scripts/harness/check_scenarios.py
