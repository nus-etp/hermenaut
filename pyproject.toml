[project]
name = "hermenaut-evals"
version = "0.0.0"
description = "Evals and tests for the hermenaut daily pipeline."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
hermes-extras = [
    "ddgs>=9.14.4",
    "langfuse>=4.7.1",
]

[build-system]
# setuptools>=84.1.0: fixes GHSA-h35f-9h28-mq5c / CVE-2026-59890 (MANIFEST.in
# exclude/prune Unicode-normalization bypass on macOS APFS/HFS+, fixed in
# 83.0.0) and GHSA-xmj3-9gf7-h52w (legacy wheel install can write outside the
# destination dir on Windows via namespace_packages.txt, fixed in 84.1.0).
# The >=78.1.1 floor permitted installing vulnerable releases.
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a tests-only project; no importable package ships from the repo root.
packages = []

[tool.pyright]
# Resolve the pipeline scripts' sibling imports (user_agents, entity_terms, …).
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "scripts" lets the pipeline scripts import their sibling helpers (user_agents,
# entity_terms, …) under pytest without in-code sys.path manipulation.
pythonpath = [".", "scripts"]
markers = [
    "llm: end-to-end LLM behaviour eval (slow, requires DEEPSEEK_API_KEY)",
]
filterwarnings = [
    "error",
    "ignore:Implicitly cleaning up <HTTPError:ResourceWarning",
]
